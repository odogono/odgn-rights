# The route includes the query string when matching, so it ends in "*" to
# catch "/rights?go-get=1"; the worker passes other paths, like "/rightsx", to the origin.
# Deploy with: bunx wrangler deploy --config go-import/wrangler.toml
name = "odgn-rights-go-import"
main = "worker.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "odgn.net/rights*", zone_name = "odgn.net" },
]
